name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Welcome new contributor
        uses: actions/github-script@v7
        with:
          script: |
            const isIssue = context.eventName === 'issues';
            const isPR = context.eventName === 'pull_request_target';
            
            // Check if this is the user's first contribution
            const creator = context.payload.sender.login;
            
            if (isIssue) {
              const issue = context.payload.issue;
              
              // Get all issues by this user
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                creator: creator,
                state: 'all'
              });
              
              // If this is their first issue
              if (issues.data.length === 1) {
                await github.rest.issues.createComment({
                  issue_number: issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `👋 Thanks for opening your first issue in **ideasMatter**! 
                  
We appreciate your contribution to making this project better. A maintainer will review your issue soon. 

If you're interested in contributing code, check out our [Contributing Guide](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md)!`
                });
              }
            }
            
            if (isPR) {
              const pr = context.payload.pull_request;
              
              // Get all PRs by this user
              const prs = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                author: creator
              });
              
              // If this is their first PR
              if (prs.data.length === 1) {
                await github.rest.issues.createComment({
                  issue_number: pr.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `🎉 Congratulations on your first Pull Request to **ideasMatter**! 

Thank you for contributing! A maintainer will review your PR soon. Here's what happens next:

- ✅ Automated checks will run to validate your changes
- 👀 A maintainer will review your code
- 💬 We may request changes or ask questions
- 🎊 Once approved, your PR will be merged!

While you wait, feel free to:
- ⭐ Star the repository if you haven't already
- 📖 Check out other [open issues](https://github.com/${context.repo.owner}/${context.repo.repo}/issues) you might want to work on
- 💬 Join the discussion in our [GitHub Discussions](https://github.com/${context.repo.owner}/${context.repo.repo}/discussions)

Thanks again for your contribution! 🙏`
                });
              }
            }
