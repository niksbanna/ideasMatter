name: Auto Label

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Label PR based on changes
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            
            // Get files changed in the PR
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            
            const labels = new Set();
            
            // Analyze files to determine labels
            for (const file of files) {
              const path = file.filename;
              
              // Documentation
              if (path.match(/\.(md)$/i) || path.includes('docs/')) {
                labels.add('documentation');
              }
              
              // Dependencies
              if (path === 'package.json' || path === 'package-lock.json') {
                labels.add('dependencies');
              }
              
              // Configuration
              if (path.match(/\.(json|yml|yaml|config\.(js|ts))$/i) || path.includes('.github/')) {
                labels.add('configuration');
              }
              
              // Tests
              if (path.match(/\.(test|spec)\.(ts|tsx|js|jsx)$/i) || path.includes('__tests__/')) {
                labels.add('tests');
              }
              
              // Components/UI
              if (path.includes('components/') || path.includes('.css') || path.includes('tailwind')) {
                labels.add('ui');
              }
              
              // Backend/Services
              if (path.includes('services/') || path.includes('supabase/')) {
                labels.add('backend');
              }
              
              // Blockchain
              if (path.includes('algorand') || path.includes('wallet') || path.match(/algo/i)) {
                labels.add('blockchain');
              }
            }
            
            // Add size label based on changes
            const totalChanges = files.reduce((sum, file) => sum + file.changes, 0);
            if (totalChanges < 10) {
              labels.add('size/XS');
            } else if (totalChanges < 50) {
              labels.add('size/S');
            } else if (totalChanges < 200) {
              labels.add('size/M');
            } else if (totalChanges < 500) {
              labels.add('size/L');
            } else {
              labels.add('size/XL');
            }
            
            // Apply labels
            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: Array.from(labels)
              });
            }
