name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint check
      run: npm run lint
      continue-on-error: false
      
    - name: Build check
      run: npm run build
      continue-on-error: false
      
    - name: Type check
      run: npx tsc --noEmit
      continue-on-error: false
      
    - name: Check for console logs
      run: |
        if grep -r "console\.\(log\|debug\|info\)" src/ --exclude-dir=node_modules; then
          echo "⚠️ Warning: Found console statements in the code. Consider removing them before merging."
        fi
      continue-on-error: true
      
    - name: Comment PR
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const status = '${{ job.status }}';
          const message = status === 'success' 
            ? '✅ All checks passed! Your PR is ready for review.' 
            : '❌ Some checks failed. Please review the workflow logs.';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: message
          });
